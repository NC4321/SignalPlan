pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --check {staged_files}
    - name: lint
      glob: '*.{ts,tsx,js}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: pnpm typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
