<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalPlan</title>
    <meta
      name="description"
      content="Plan Wi-Fi coverage for your home: draw floors, place access points, see the heatmap."
    />
    <link rel="canonical" href="https://signalplan.pages.dev/" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1f1e24"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews; scripts/og-image.mjs makes the images. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SignalPlan" />
    <meta
      property="og:title"
      content="SignalPlan: predict your home's Wi-Fi from a floor plan"
    />
    <meta
      property="og:description"
      content="Draw your floors, place your access points, and see the predicted coverage as a heatmap. Free and open source (MIT), runs in your browser, no account."
    />
    <meta property="og:url" content="https://signalplan.pages.dev/" />
    <meta
      property="og:image"
      content="https://signalplan.pages.dev/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SignalPlan showing a sample bungalow's floor plan with a Wi-Fi heatmap over it, from one router."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SignalPlan: predict your home's Wi-Fi from a floor plan"
    />
    <meta
      name="twitter:description"
      content="Draw your floors, place your access points, and see the predicted coverage as a heatmap. Free and open source (MIT), runs in your browser, no account."
    />
    <meta
      name="twitter:image"
      content="https://signalplan.pages.dev/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="SignalPlan showing a sample bungalow's floor plan with a Wi-Fi heatmap over it, from one router."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
