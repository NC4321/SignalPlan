<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>The model draws one straight line; real signal also bounces and bends</title>
  <desc>Plan view of two rooms joined by a doorway. The model sends one straight line from the access point through the wall to the phone and charges the wall. In a real home, signal also bounces off walls and bends through the doorway, which the model leaves out.</desc>
  <rect width="680" height="340" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#1f2328">What the model draws, and what it leaves out</text>
  <rect x="40" y="50" width="600" height="190" fill="none" stroke="#57606a" stroke-width="4"/>
  <line x1="340" y1="50" x2="340" y2="170" stroke="#57606a" stroke-width="4"/>
  <line x1="340" y1="220" x2="340" y2="240" stroke="#57606a" stroke-width="4"/>
  <text x="352" y="216" fill="#57606a" font-size="14">doorway</text>
  <path d="M 110 205 L 250 50 L 560 90" fill="none" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M 110 205 L 340 195 Q 380 190 400 160 L 560 90" fill="none" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="110" y1="205" x2="560" y2="90" stroke="#0969da" stroke-width="3.5"/>
  <circle cx="110" cy="205" r="11" fill="#0969da"/>
  <text x="110" y="232" text-anchor="middle" fill="#1f2328" font-size="14">access point</text>
  <rect x="548" y="78" width="24" height="24" rx="5" fill="#1a7f37"/>
  <text x="560" y="124" text-anchor="middle" fill="#1f2328" font-size="14">phone</text>
  <g font-size="14" fill="#1f2328">
    <line x1="40" y1="266" x2="80" y2="266" stroke="#0969da" stroke-width="3.5"/>
    <text x="92" y="271">What the model draws: one straight line, charged for the wall it crosses</text>
    <line x1="40" y1="288" x2="80" y2="288" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="92" y="293">Bounces off a wall: not modelled</text>
    <line x1="40" y1="310" x2="80" y2="310" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="92" y="315">Bends through the doorway: not modelled</text>
  </g>
</svg>
