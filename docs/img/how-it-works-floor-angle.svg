<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>The same timber floor costs more the shallower the signal meets it</title>
  <desc>Side view of two storeys. An access point downstairs sends one path straight up through the timber floor, which costs 2.7 dB at 5 GHz, and another to a phone 10 m across upstairs, which meets the floor at 75 degrees from the vertical and costs 6.6 dB.</desc>
  <rect width="680" height="320" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#1f2328">Through a timber floor at 5 GHz: straight up, and from 10 m away</text>
  <text x="20" y="302" font-size="12" fill="#57606a">Not to scale vertically: the storey is 2.7 m high, the far phone 10 m across.</text>
  <rect x="40" y="170" width="620" height="16" fill="#8c959f"/>
  <text x="640" y="164" text-anchor="end" fill="#57606a" font-size="13">upstairs</text>
  <text x="640" y="234" text-anchor="end" fill="#57606a" font-size="13">downstairs</text>
  <circle cx="90" cy="240" r="10" fill="#0969da"/>
  <text x="90" y="272" text-anchor="middle" fill="#1f2328" font-size="13">access point</text>
  <line x1="90" y1="240" x2="90" y2="100" stroke="#0969da" stroke-width="3"/>
  <rect x="78" y="82" width="24" height="24" rx="5" fill="#1a7f37"/>
  <text x="112" y="62" fill="#0969da" font-weight="600" font-size="14">straight up: 0°</text>
  <text x="112" y="80" fill="#0969da" font-size="14">floor costs 2.7 dB</text>
  <line x1="90" y1="240" x2="570" y2="100" stroke="#bc4c00" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="558" y="82" width="24" height="24" rx="5" fill="#1a7f37"/>
  <line x1="90" y1="240" x2="90" y2="205" stroke="#57606a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 90 215 A 25 25 0 0 1 114 233" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text x="400" y="56" text-anchor="middle" fill="#bc4c00" font-weight="600" font-size="14">10 m across: 75° from the vertical</text>
  <text x="400" y="74" text-anchor="middle" fill="#bc4c00" font-size="14">floor costs 6.6 dB</text>
  <text x="400" y="262" text-anchor="middle" fill="#57606a" font-size="13">the path runs further inside the floor, so it loses more</text>
  <text x="470" y="206" fill="#1f2328" font-size="12" font-weight="600">timber joist floor</text>
</svg>
