<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <title>Wi-Fi channels as slices of the radio spectrum, and where they overlap</title>
  <desc>Top: 5 GHz channels on a frequency axis from 5170 to 5250 MHz. Four 20 MHz channels, 36, 40, 44 and 48, sit side by side. Two 40 MHz channels, 38 and 46, each cover two of them. One 80 MHz channel, 42, covers all four. Bottom: on 2.4 GHz, channels 1 and 3 overlap by half, while 1 and 6 do not overlap.</desc>
  <rect width="680" height="450" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#1f2328">Channels are slices of spectrum. Wider slices overlap more.</text>
  <text x="20" y="54" font-size="14" font-weight="600" fill="#57606a">5 GHz (US), 5170 to 5250 MHz</text>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">
    <rect x="62" y="66" width="596" height="30" rx="4" fill="#1a7f37" fill-opacity="0.35" stroke="#1a7f37" stroke-width="2"/>
    <text x="360" y="86">80 MHz: channel 42</text>
    <rect x="62" y="102" width="296" height="30" rx="4" fill="#0969da" fill-opacity="0.35" stroke="#0969da" stroke-width="2"/>
    <text x="210" y="122">40 MHz: ch 38</text>
    <rect x="362" y="102" width="296" height="30" rx="4" fill="#0969da" fill-opacity="0.35" stroke="#0969da" stroke-width="2"/>
    <text x="510" y="122">40 MHz: ch 46</text>
    <rect x="62" y="138" width="146" height="30" rx="4" fill="#bc4c00" fill-opacity="0.35" stroke="#bc4c00" stroke-width="2"/>
    <text x="135" y="158">20: ch 36</text>
    <rect x="212" y="138" width="146" height="30" rx="4" fill="#bc4c00" fill-opacity="0.35" stroke="#bc4c00" stroke-width="2"/>
    <text x="285" y="158">20: ch 40</text>
    <rect x="362" y="138" width="146" height="30" rx="4" fill="#bc4c00" fill-opacity="0.35" stroke="#bc4c00" stroke-width="2"/>
    <text x="435" y="158">20: ch 44</text>
    <rect x="512" y="138" width="146" height="30" rx="4" fill="#bc4c00" fill-opacity="0.35" stroke="#bc4c00" stroke-width="2"/>
    <text x="585" y="158">20: ch 48</text>
  </g>
  <line x1="60" y1="176" x2="660" y2="176" stroke="#57606a" stroke-width="1.5"/>
  <g fill="#57606a" font-size="13" text-anchor="middle">
    <text x="60" y="194">5170</text><text x="210" y="194">5190</text><text x="360" y="194">5210</text><text x="510" y="194">5230</text><text x="660" y="194">5250</text>
  </g>
  <g font-size="14" fill="#1f2328">
    <text x="20" y="220">36 and 44 don't overlap at 20 MHz.</text>
    <text x="20" y="240">Inside the 80 MHz channel 42, they do.</text>
  </g>
  <line x1="20" y1="256" x2="660" y2="256" stroke="#d0d7de"/>
  <text x="20" y="282" font-size="14" font-weight="600" fill="#57606a">2.4 GHz, 2400 to 2450 MHz, 20 MHz channels</text>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">
    <rect x="84" y="294" width="240" height="30" rx="4" fill="#0969da" fill-opacity="0.35" stroke="#0969da" stroke-width="2"/>
    <text x="144" y="314">channel 1</text>
    <rect x="204" y="330" width="240" height="30" rx="4" fill="#bc4c00" fill-opacity="0.35" stroke="#bc4c00" stroke-width="2"/>
    <text x="384" y="350">channel 3</text>
    <rect x="384" y="294" width="240" height="30" rx="4" fill="#1a7f37" fill-opacity="0.35" stroke="#1a7f37" stroke-width="2"/>
    <text x="504" y="314">channel 6</text>
  </g>
  <rect x="204" y="294" width="120" height="66" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="264" y="378" text-anchor="middle" fill="#cf222e" font-size="14" font-weight="600">shared: 10 of 20 MHz</text>
  <line x1="60" y1="390" x2="660" y2="390" stroke="#57606a" stroke-width="1.5"/>
  <g fill="#57606a" font-size="13" text-anchor="middle">
    <text x="84" y="408">2402</text><text x="204" y="408">2412</text><text x="324" y="408">2422</text><text x="444" y="408">2432</text><text x="564" y="408">2442</text>
  </g>
  <text x="20" y="436" font-size="14" fill="#1f2328">1 and 6 don't overlap: hence 1, 6 and 11.</text>
</svg>
